name: build-mtp

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build .mtp
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-mtp
          path: out/*.mtp
