name: build-mtp

on:
  push:
    branches: [main]
    paths-ignore: ['dist/**']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build .mtp
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-mtp
          path: out/*.mtp
      - name: Commit .mtp to dist/
        run: |
          mkdir -p dist
          cp out/*.mtp dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet && exit 0
          git commit -m "dist: build ${GITHUB_SHA::7} [skip ci]"
          git push
